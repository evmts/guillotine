name: Continuous Fuzzing

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly deep fuzzing campaign at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Fuzz campaign duration in seconds per phase'
        required: false
        default: '120'

permissions:
  contents: read

jobs:
  zig-fuzz-ubuntu:
    name: Zig Native --fuzz & Multi-Threaded Campaign (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig 0.17.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      # `zig build` compiles Voltaire's Rust archive (cargo --locked) itself.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Zig fuzz corpus & leak regression suite
        run: zig build test-fuzz

      - name: Run multi-threaded cross-subsystem fuzz campaign
        env:
          SECONDS_INPUT: ${{ inputs.duration_seconds || (github.event_name == 'schedule' && '300' || '45') }}
        run: |
          set -euo pipefail
          case "$SECONDS_INPUT" in
            ''|*[!0-9]*) echo "::error::duration_seconds must be a positive integer" >&2; exit 1 ;;
          esac
          THREADS_INPUT="$(nproc)"
          zig build fuzz-campaign -Doptimize=ReleaseSafe -- --seconds="$SECONDS_INPUT" --threads="$THREADS_INPUT"

      - name: Run Zig LLVM coverage-guided --fuzz on differential EVM & precompiles
        env:
          SECONDS_INPUT: ${{ inputs.duration_seconds || (github.event_name == 'schedule' && '180' || '30') }}
        run: |
          case "$SECONDS_INPUT" in
            ''|*[!0-9]*) echo "::error::duration_seconds must be a positive integer" >&2; exit 1 ;;
          esac
          DURATION="$SECONDS_INPUT"
          for TARGET in \
            "fuzz differential EVM execution" \
            "fuzz bytecode jumpdest reference oracle" \
            "fuzz MODEXP precompile" \
            "fuzz database nested snapshots"; do
            echo "=== LLVM coverage-guided --fuzz: ${TARGET} (${DURATION}s) ==="
            set +e
            timeout --signal=INT "${DURATION}" zig build test-fuzz --fuzz -Dtest-filter="${TARGET}"
            RC=$?
            set -e
            if [ "${RC}" -ne 0 ] && [ "${RC}" -ne 124 ] && [ "${RC}" -ne 130 ]; then
              echo "Fuzz failure in ${TARGET} (exit ${RC})"
              exit "${RC}"
            fi
          done

      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zig-fuzz-crashes
          path: |
            .fuzz-crashes/
            .zig-cache/f/
          if-no-files-found: ignore

  rust-ark-fuzz:
    name: Rust BN254 & BLS12-381 FFI Fuzz Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Rust BN254/BLS12-381 property & adversarial FFI fuzz tests
        run: cargo test --locked -p bn254_wrapper -- --nocapture

  typescript-sdk-fuzz:
    name: TypeScript SDK Feedback-Guided FFI Fuzz Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig 0.17.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      # `zig build` compiles Voltaire's Rust archive (cargo --locked) itself.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build native FFI shared library
        run: zig build shared -Doptimize=ReleaseFast

      - name: Run TypeScript feedback-guided fuzz tests & campaign
        working-directory: sdks/typescript
        run: |
          GUILLOTINE_FUZZ_EXECS=1500 bun run test:fuzz
          bun run fuzz -- --executions=2000
