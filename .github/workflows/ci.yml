name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ast-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig 0.17.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.1
      - name: Every tracked Zig file parses (zig ast-check)
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          checked=0
          while IFS= read -r -d '' file; do
            checked=$((checked + 1))
            if ! zig ast-check "$file"; then failed=$((failed + 1)); fi
          done < <(git ls-files -z -- '*.zig')
          echo "zig ast-check: $checked tracked files, $failed failed"
          test "$checked" -gt 0
          test "$failed" -eq 0
      - name: Canonical Zig formatting (zig fmt --check src/)
        run: zig fmt --check src/
      - name: TigerStyle hygiene check (no prod debug prints or empty catches)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path("src")
          bad = []
          for p in sorted(root.rglob("*.zig")):
              if p.name.endswith(("_test.zig", "_tests.zig", "_bench.zig")) or "/_test_utils/" in str(p):
                  continue
              lines = p.read_text(errors="replace").splitlines()
              for idx, line in enumerate(lines, 1):
                  if re.match(r'^test\s*(?:"[^"]*")?\s*\{', line):
                      break
                  code = line.split("//", 1)[0]
                  if "std.debug.print(" in code:
                      bad.append(f"{p}:{idx}: forbidden std.debug.print in production code")
                  if re.search(r'\bcatch\s*\{\s*\}', code):
                      bad.append(f"{p}:{idx}: forbidden empty catch {{}} in production code")
          if bad:
              print("\n".join(bad), file=sys.stderr)
              sys.exit(1)
          print("TigerStyle hygiene check passed.")
          PY

  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.smithers/cache/tools/zig/global
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.smithers/cache/tools/zig/local
      # One Cargo target directory for `cargo test` and the Rust archives that
      # build.zig links (lib/bn254.zig, lib/foundry.zig). Voltaire's
      # libcrypto_wrappers.a is built by `zig build` itself into the Zig cache.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Zig 0.17.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.1
      - name: Select a macOS SDK that Zig 0.17.1 can link
        if: runner.os == 'macOS'
        shell: bash
        # Some macOS SDKs list libSystem stubs only for arm64e-macos, which Zig
        # does not use, so native links fail with "undefined symbol: _abort".
        # Keep the default Xcode while it links; otherwise use the newest one that does.
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/zig-sdk-probe"
          mkdir -p "$probe"
          printf 'pub fn main() void {}\n' > "$probe/main.zig"
          for dev in "$(xcode-select -p)" $(printf "%s\n" /Applications/Xcode_*.app | sort -rV | sed 's|$|/Contents/Developer|'); do
            # Without an SDK, Zig links against its bundled stubs, which proves nothing.
            if ! sdk="$(DEVELOPER_DIR="$dev" xcrun --sdk macosx --show-sdk-path 2>/dev/null)"; then
              echo "Skipping $dev: no macOS SDK"
              continue
            fi
            if DEVELOPER_DIR="$dev" zig build-exe "$probe/main.zig" -femit-bin="$probe/main" > "$probe/log" 2>&1 && "$probe/main"; then
              echo "Zig links against $sdk"
              echo "DEVELOPER_DIR=$dev" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Skipping $dev: $(grep -m1 error: "$probe/log" || tail -n1 "$probe/log")"
          done
          echo "::error::No installed Xcode has a macOS SDK that Zig 0.17.1 can link against." >&2
          exit 1
      - name: Record toolchain and architecture
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          zig version
          rustc --version
          cargo --version
          uname -sm
          if [[ "$RUNNER_OS" == Linux ]]; then test "$(uname -m)" = x86_64; fi
          echo "rust=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: |
            .smithers/cache/tools/zig/global
            .smithers/cache/tools/zig/local
          key: ${{ runner.os }}-${{ runner.arch }}-zig-0.17.1-${{ hashFiles('**/*.zig', '**/*.zig.zon', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-0.17.1-
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ steps.toolchain.outputs.rust }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ steps.toolchain.outputs.rust }}-
      - name: Foundry Linux archive regression (#815)
        run: node --test .smithers/tests/foundry-link.test.mjs
      - name: Rust workspace tests
        run: cargo test --locked
      - name: Build
        run: zig build
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: zig build test-unit
      - name: Opcode differential tests
        if: ${{ !cancelled() }}
        run: zig build test-opcodes
      - name: MODEXP arithmetic and gas tests
        if: ${{ !cancelled() }}
        run: zig build test-modexp
      - name: Precompile tests
        if: ${{ !cancelled() }}
        run: zig build test-precompiles
      - name: Layer 2 tests
        if: ${{ !cancelled() }}
        run: zig build test-layer2
      - name: Benchmark harness tests
        if: ${{ !cancelled() }}
        run: zig build test-bench
      - name: Fusion tests
        if: ${{ !cancelled() }}
        run: zig build test-fusions
      - name: Integration tests
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: zig build test-integration
      - name: Fuzz campaign smoke run (5 s)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: zig build fuzz-campaign -Doptimize=ReleaseSafe -- --seconds=5
      - name: JIT tests (macOS arm64)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          zig build test-jit
      - name: FFI libraries (ReleaseFast)
        if: ${{ !cancelled() }}
        run: zig build shared static -Doptimize=ReleaseFast
      - name: C SDK tests
        if: ${{ !cancelled() }}
        run: make -f sdks/c/Makefile -o build-core test
      - name: Setup Bun
        if: ${{ !cancelled() }}
        uses: oven-sh/setup-bun@v2
      - name: TypeScript SDK tests
        if: ${{ !cancelled() }}
        working-directory: sdks/typescript
        run: |
          bun install --frozen-lockfile
          bun test

  state-tests:
    name: state-tests (fusion ${{ matrix.fusion && 'on' || 'off' }})
    strategy:
      fail-fast: false
      matrix:
        fusion: [true, false]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.smithers/cache/tools/zig/global
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.smithers/cache/tools/zig/local
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Every case of the pinned release (Frontier through Osaka) must pass.
      EEST_EXPECTED_CASES: 66652
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Zig 0.17.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.1
      - name: Cache EEST fixtures
        uses: actions/cache@v4
        with:
          path: .cache/eest-fixtures
          key: eest-fixtures-${{ hashFiles('scripts/fetch-eest-fixtures.sh') }}
      - name: Fetch official EEST state fixtures (pinned release and SHA-256)
        run: scripts/fetch-eest-fixtures.sh
      - name: Official EEST state tests
        run: >-
          zig build state-tests -Doptimize=ReleaseSafe
          -Devm-enable-fusion=${{ matrix.fusion }}
          -- --report=eest-report-fusion-${{ matrix.fusion }}.json
      - name: Every pinned case ran and passed
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - "eest-report-fusion-${{ matrix.fusion }}.json" "$EEST_EXPECTED_CASES" <<'PY'
          import json, sys
          totals = json.load(open(sys.argv[1]))["totals"]
          expected = int(sys.argv[2])
          print(f"EEST: {totals['passed']} / {totals['cases']} passed, {totals['failed']} failed")
          if totals["cases"] != expected or totals["passed"] != expected or totals["failed"] != 0:
              sys.exit(f"expected {expected} / {expected} passing cases")
          PY
      - name: Upload EEST report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: eest-report-fusion-${{ matrix.fusion }}
          path: eest-report-fusion-${{ matrix.fusion }}.json
          if-no-files-found: ignore
