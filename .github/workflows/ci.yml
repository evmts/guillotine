name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.smithers/cache/tools/zig/global
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.smithers/cache/tools/zig/local
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Zig 0.15.2
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2
      - name: Select a macOS SDK that Zig 0.15.2 can link
        if: runner.os == 'macOS'
        shell: bash
        # macOS SDK 26.4 and later list libSystem stubs for arm64e-macos but
        # not arm64-macos. Zig 0.15.2 ignores arm64e stubs, so every native
        # link fails with "undefined symbol: _abort" and friends. Keep the
        # default Xcode while it links; otherwise use the newest one that does.
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/zig-sdk-probe"
          mkdir -p "$probe"
          printf 'pub fn main() void {}\n' > "$probe/main.zig"
          for dev in "$(xcode-select -p)" $(printf "%s\n" /Applications/Xcode_*.app | sort -rV | sed 's|$|/Contents/Developer|'); do
            # Without an SDK, Zig links against its bundled stubs, which proves nothing.
            if ! sdk="$(DEVELOPER_DIR="$dev" xcrun --sdk macosx --show-sdk-path 2>/dev/null)"; then
              echo "Skipping $dev: no macOS SDK"
              continue
            fi
            if DEVELOPER_DIR="$dev" zig build-exe "$probe/main.zig" -femit-bin="$probe/main" > "$probe/log" 2>&1 && "$probe/main"; then
              echo "Zig links against $sdk"
              echo "DEVELOPER_DIR=$dev" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Skipping $dev: $(grep -m1 error: "$probe/log" || tail -n1 "$probe/log")"
          done
          echo "::error::No installed Xcode has a macOS SDK that Zig 0.15.2 can link against." >&2
          exit 1
      - name: Record toolchain and architecture
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          zig version
          rustc --version
          cargo --version
          uname -sm
          if [[ "$RUNNER_OS" == Linux ]]; then test "$(uname -m)" = x86_64; fi
          echo "rust=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: |
            .smithers/cache/tools/zig/global
            .smithers/cache/tools/zig/local
          key: ${{ runner.os }}-${{ runner.arch }}-zig-0.15.2-${{ hashFiles('**/*.zig', '**/*.zig.zon', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-0.15.2-
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ steps.toolchain.outputs.rust }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ steps.toolchain.outputs.rust }}-
      - name: Foundry Linux archive regression (#815)
        run: node --test .smithers/tests/foundry-link.test.mjs
      - name: Voltaire archive fresh-checkout regression (#862, #863)
        if: ${{ !cancelled() }}
        run: node --test .smithers/tests/voltaire-archive.test.mjs
      # No prebuilt archive: lib/voltaire/target is uncached, so this is the
      # fresh-clone `zig build` that #862 and #863 report.
      - name: Build
        if: ${{ !cancelled() }}
        run: zig build
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: zig build test-unit
      - name: Opcode differential tests
        if: ${{ !cancelled() }}
        run: zig build test-opcodes
      - name: MODEXP arithmetic and gas tests
        if: ${{ !cancelled() }}
        # The root build has no test-modexp step; the supplemental build uses
        # the repository's MODEXP implementation and tests without duplicating it.
        run: zig build test-modexp --build-file .smithers/build.zig
