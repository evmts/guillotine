name: Release & Docs Publish

# Automated release and documentation publishing when changes land on `main`
# (mirrored from Smithers Cloud) or when a `v*` tag is pushed:
#
# 1. Version bump on `main` (or `v*` tag): builds C FFI shared libraries on
#    macOS arm64 and Linux x86_64 (glibc >= 2.28), creates a GitHub Release
#    with libguillotine_ffi.so, libguillotine_ffi.dylib, guillotine.h and
#    SHA256SUMS.txt, and publishes @tevm/guillotine to npm with provenance
#    when NPM_TOKEN is configured.
# 2. Docs, wiki, audit, or factory changes on `main` (or `v*` tag): rebuilds
#    docs/public/wiki.html, docs/public/audit.html, and Vocs docs (including
#    llms.txt), deploys to Vercel when VERCEL_TOKEN is configured, and pushes
#    fresh feeds to Smithers Cloud when SMITHERS_FEED_KEY is configured.
# 3. `workflow_dispatch` lets maintainers force a docs deploy or run a full
#    release dry-run / publish on demand.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      force_docs_deploy:
        description: 'Build and publish Vocs docs, wiki, and Lighthouse audit'
        type: boolean
        default: true
      run_release_build:
        description: 'Run full native release build and dry-run packaging'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release & docs publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      should_release: ${{ steps.read.outputs.should_release }}
      publish_release: ${{ steps.read.outputs.publish_release }}
      should_publish_docs: ${{ steps.read.outputs.should_publish_docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version parity and determine release/docs actions
        id: read
        shell: bash
        run: |
          set -euo pipefail
          zon="$(sed -n 's/^[[:space:]]*\.version = "\([^"]*\)",.*/\1/p' build.zig.zon | head -n 1)"
          npm_version="$(python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1]))["version"])' sdks/typescript/package.json)"
          echo "build.zig.zon: $zon, sdks/typescript/package.json: $npm_version"
          test -n "$zon"
          if [ "$zon" != "$npm_version" ]; then
            echo "::error::build.zig.zon ($zon) and sdks/typescript/package.json ($npm_version) disagree" >&2
            exit 1
          fi

          tag="v${zon}"
          should_release="false"
          publish_release="false"
          should_publish_docs="false"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "${GITHUB_REF_NAME#v}" != "$zon" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match version $zon" >&2
              exit 1
            fi
            should_release="true"
            publish_release="true"
            should_publish_docs="true"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "${{ inputs.run_release_build }}" = "true" ]; then
              should_release="true"
            fi
            if [ "${{ inputs.force_docs_deploy }}" = "true" ]; then
              should_publish_docs="true"
            fi
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            # Trigger a release automatically if this version has no git tag yet AND has a CHANGELOG.md entry.
            if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              if grep -Eq "^##[[:space:]]+\[?${zon//./\\.}\]?" CHANGELOG.md; then
                should_release="true"
                publish_release="true"
                should_publish_docs="true"
              fi
            fi

            # Trigger docs/wiki/audit publish whenever docs, wiki, audit, factory, or changelog changed.
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
              changed="$(git diff --name-only "$before" "$GITHUB_SHA")"
            else
              changed="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
            fi
            if printf '%s\n' "$changed" | grep -Eq '^(docs/|\.smithers/wiki/|\.smithers/reports/|\.smithers/FACTORY\.ts|\.smithers/home\.json|\.agents/uphill/|CHANGELOG\.md|README\.md)'; then
              should_publish_docs="true"
            fi
          fi

          echo "version=$zon" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "publish_release=$publish_release" >> "$GITHUB_OUTPUT"
          echo "should_publish_docs=$should_publish_docs" >> "$GITHUB_OUTPUT"
          echo "Plan: version=$zon tag=$tag should_release=$should_release publish_release=$publish_release should_publish_docs=$should_publish_docs"

  build:
    name: Build ${{ matrix.platform }}
    needs: plan
    if: ${{ needs.plan.outputs.should_release == 'true' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
            machine: arm64
            shared: libguillotine_ffi.dylib
            zig_target: ''
          - os: ubuntu-latest
            platform: linux-x64
            machine: x86_64
            shared: libguillotine_ffi.so
            zig_target: x86_64-linux-gnu.2.28
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      VERSION: ${{ needs.plan.outputs.version }}
      ZIG_TARGET: ${{ matrix.zig_target }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Zig 0.17.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.1
      - name: Select a macOS SDK that Zig 0.17.1 can link
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/zig-sdk-probe"
          mkdir -p "$probe"
          printf 'pub fn main() void {}\n' > "$probe/main.zig"
          for dev in "$(xcode-select -p)" $(printf "%s\n" /Applications/Xcode_*.app | sort -rV | sed 's|$|/Contents/Developer|'); do
            if ! sdk="$(DEVELOPER_DIR="$dev" xcrun --sdk macosx --show-sdk-path 2>/dev/null)"; then
              echo "Skipping $dev: no macOS SDK"
              continue
            fi
            if DEVELOPER_DIR="$dev" zig build-exe "$probe/main.zig" -femit-bin="$probe/main" > "$probe/log" 2>&1 && "$probe/main"; then
              echo "Zig links against $sdk"
              echo "DEVELOPER_DIR=$dev" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Skipping $dev: $(grep -m1 error: "$probe/log" || tail -n1 "$probe/log")"
          done
          echo "::error::No installed Xcode has a macOS SDK that Zig 0.17.1 can link against." >&2
          exit 1
      - name: Runner architecture is ${{ matrix.machine }}
        shell: bash
        run: |
          set -euo pipefail
          zig version
          cargo --version
          uname -sm
          test "$(uname -m)" = "${{ matrix.machine }}"
      - name: Build the FFI shared library (ReleaseFast, debug info stripped)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$ZIG_TARGET" ]; then
            zig build shared -Doptimize=ReleaseFast -Dstrip=true -Dtarget="$ZIG_TARGET"
          else
            zig build shared -Doptimize=ReleaseFast -Dstrip=true
          fi
      - name: glibc symbol versions stay at or below 2.28
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          newest="$(objdump -T zig-out/lib/libguillotine_ffi.so | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n 1)"
          echo "newest GLIBC symbol version: $newest"
          test "$(printf '%s\n2.28\n' "$newest" | sort -V | tail -n 1)" = "2.28"
      - name: C SDK tests
        run: make -f sdks/c/Makefile -o build-core test
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: TypeScript SDK tests against the ${{ matrix.platform }} prebuild
        working-directory: sdks/typescript
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun scripts/copy-native.ts
          test -f "prebuilds/${{ matrix.platform }}/${{ matrix.shared }}"
          GUILLOTINE_LIB_PATH="$PWD/prebuilds/${{ matrix.platform }}/${{ matrix.shared }}" bun test
      - name: Upload the ${{ matrix.platform }} shared library
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.platform }}
          path: zig-out/lib/${{ matrix.shared }}
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: [plan, build]
    if: ${{ needs.plan.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      PUBLISH_RELEASE: ${{ needs.plan.outputs.publish_release }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - name: Download shared libraries
        uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: artifacts/prebuilds
      - name: Collect release assets and write SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/prebuilds/prebuild-darwin-arm64/libguillotine_ffi.dylib release/
          cp artifacts/prebuilds/prebuild-linux-x64/libguillotine_ffi.so release/
          cp sdks/c/include/guillotine.h release/
          (cd release && sha256sum libguillotine_ffi.so libguillotine_ffi.dylib guillotine.h > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt
          ls -l release
      - name: Upload release assets (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/
          if-no-files-found: error
      - name: Extract this version's CHANGELOG.md section
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - "$VERSION" CHANGELOG.md notes.md <<'PY'
          import re, sys
          from pathlib import Path
          version, changelog, out = sys.argv[1], Path(sys.argv[2]), Path(sys.argv[3])
          text = changelog.read_text(encoding="utf-8") if changelog.is_file() else ""
          match = re.search(rf"^##\s+\[?{re.escape(version)}\]?(?:\s.*)?$", text, re.MULTILINE)
          body = ""
          if match:
              body = text[match.end():]
              nxt = re.search(r"^##\s+", body, re.MULTILINE)
              if nxt:
                  body = body[:nxt.start()]
              lines = body.strip().splitlines()
              while lines and re.match(r"^\[[^\]]+\]:\s+\S+", lines[-1]):
                  lines.pop()
              body = "\n".join(lines).strip()
          out.write_text(body + "\n" if body else "", encoding="utf-8")
          print(f"CHANGELOG notes for {version}: {len(body)} characters")
          PY
      - name: Create GitHub Release
        if: env.PUBLISH_RELEASE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Skipping duplicate release creation."
            exit 0
          fi
          notes=(--generate-notes)
          if [ -s notes.md ]; then notes=(--notes-file notes.md); fi
          target_args=(--target "$GITHUB_SHA")
          if [ "$IS_TAG" = "true" ]; then target_args=(--verify-tag); fi
          gh release create "$TAG" \
            "${target_args[@]}" \
            --title "Guillotine $TAG" \
            "${notes[@]}" \
            release/libguillotine_ffi.so \
            release/libguillotine_ffi.dylib \
            release/guillotine.h \
            release/SHA256SUMS.txt

  npm:
    name: Publish @tevm/guillotine
    needs: [plan, build]
    if: ${{ needs.plan.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      PUBLISH_RELEASE: ${{ needs.plan.outputs.publish_release }}
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Download npm prebuilds
        uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: artifacts/prebuilds
      - name: Combine prebuilds into sdks/typescript/prebuilds
        shell: bash
        run: |
          set -euo pipefail
          for platform in darwin-arm64 linux-x64; do
            mkdir -p "sdks/typescript/prebuilds/$platform"
            cp "artifacts/prebuilds/prebuild-$platform/"* "sdks/typescript/prebuilds/$platform/"
          done
          test -f sdks/typescript/prebuilds/darwin-arm64/libguillotine_ffi.dylib
          test -f sdks/typescript/prebuilds/linux-x64/libguillotine_ffi.so
          ls -l sdks/typescript/prebuilds/*
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Setup Node for npm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Build, typecheck, test and lint the package
        working-directory: sdks/typescript
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run typecheck
          GUILLOTINE_LIB_PATH="$PWD/prebuilds/linux-x64/libguillotine_ffi.so" bun test
          bun run lint:package
      - name: Pack (dry run)
        working-directory: sdks/typescript
        run: npm pack --dry-run --ignore-scripts
      - name: Publish @tevm/guillotine to npm
        if: ${{ env.PUBLISH_RELEASE == 'true' && env.HAS_NPM_TOKEN == 'true' }}
        working-directory: sdks/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public --ignore-scripts
      - name: NPM_TOKEN is not set
        if: ${{ env.PUBLISH_RELEASE == 'true' && env.HAS_NPM_TOKEN != 'true' }}
        run: echo "::notice::NPM_TOKEN secret is not set; skipped npm publish of @tevm/guillotine@${VERSION}. The GitHub Release still publishes."

  docs-publish:
    name: Build & Publish Docs, Audit & Wiki
    needs: plan
    if: ${{ needs.plan.outputs.should_publish_docs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
      HAS_SMITHERS_FEED_KEY: ${{ secrets.SMITHERS_FEED_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: oven-sh/setup-bun@v2
      - name: Verify wiki and Lighthouse audit outputs
        run: |
          node .smithers/wiki/build-feed.mjs --write --check
          node .smithers/reports/audit.mjs --check
      - name: Build Vocs documentation site
        working-directory: docs
        run: |
          npm ci
          npm run build
          test -f dist/public/llms.txt
          test -f dist/public/audit.html
          test -f dist/public/wiki.html
      - name: Upload built docs bundle
        uses: actions/upload-artifact@v4
        with:
          name: guillotine-docs-site
          path: docs/dist
          if-no-files-found: error
      - name: Deploy docs to Vercel production
        if: ${{ env.HAS_VERCEL_TOKEN == 'true' }}
        working-directory: docs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
      - name: VERCEL_TOKEN notice
        if: ${{ env.HAS_VERCEL_TOKEN != 'true' }}
        run: echo "::notice::VERCEL_TOKEN/VERCEL_ORG_ID/VERCEL_PROJECT_ID not set; Vercel Git integration handles guillotine.tevm.sh deploys automatically on push to main."
      - name: Publish wiki and backpressure audit feeds to Smithers Cloud
        if: ${{ env.HAS_SMITHERS_FEED_KEY == 'true' }}
        env:
          SMITHERS_FEED_KEY: ${{ secrets.SMITHERS_FEED_KEY }}
        run: |
          node .smithers/wiki/build-feed.mjs --push
          node .smithers/reports/audit.mjs --push
      - name: SMITHERS_FEED_KEY notice
        if: ${{ env.HAS_SMITHERS_FEED_KEY != 'true' }}
        run: echo "::notice::SMITHERS_FEED_KEY not set; skipped pushing remote wiki/audit feeds to smithers.sh."
