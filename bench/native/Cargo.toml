# Build the existing vendored FFI source without changing the root Cargo
# workspace (which currently omits lib/voltaire).
[package]
name = "guillotine-bench-crypto"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
name = "crypto_wrappers"
crate-type = ["staticlib"]
path = "../../lib/voltaire/src/crypto/lib.rs"

[dependencies]
ark-bn254 = "0.6.0"
ark-ec = "0.6.0"
ark-ff = "0.6.0"
ark-serialize = "0.6.0"
ark-bls12-381 = "0.6.0"
keccak-asm = { version = "0.1.9", optional = true }
tiny-keccak = { version = "2.0", features = ["keccak"], optional = true }

[features]
default = ["asm"]
asm = ["keccak-asm"]
portable = ["tiny-keccak"]

[profile.release]
opt-level = 3
panic = "unwind"
