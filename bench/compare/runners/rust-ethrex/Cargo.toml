[workspace]

[package]
name = "compare-ethrex"
version = "0.1.0"
edition = "2024"

[dependencies]
ethrex-levm = { git = "https://github.com/lambdaclass/ethrex", rev = "fc7d69250d1a" }
ethrex-common = { git = "https://github.com/lambdaclass/ethrex", rev = "fc7d69250d1a" }
ethrex-crypto = { git = "https://github.com/lambdaclass/ethrex", rev = "fc7d69250d1a" }
bytes = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[profile.release]
opt-level = 3
panic = "abort"
lto = "thin"
codegen-units = 1
