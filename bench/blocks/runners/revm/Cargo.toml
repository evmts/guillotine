[workspace]

[package]
name = "blocks-revm"
version = "0.1.0"
edition = "2024"

[dependencies]
revm = { git = "https://github.com/bluealloy/revm", rev = "61eb0f231227", features = ["std", "secp256k1", "blst", "c-kzg", "portable", "asm-keccak"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[profile.release]
opt-level = 3
panic = "abort"
lto = "thin"
codegen-units = 1
