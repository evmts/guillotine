<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-/0/drC+CPoOkUD/JJgycUXm6nhYjan6VPf+vMgz2XFQ='; style-src 'sha256-V0xAgQfDhYrc6VIMczbTMURltsJbLYV4ln0M7dehd70='; base-uri 'none'; form-action 'none'; connect-src 'none'">
<title>Guillotine EVM Playground</title>
<style>
:root { color-scheme: light dark; font: 15px/1.5 system-ui, -apple-system, sans-serif }
body { margin: 0; padding: clamp(16px, 4vw, 36px); background: Canvas; color: CanvasText }
main { max-width: 860px; margin: auto; display: grid; gap: 18px }
h1 { margin: 0; font-size: clamp(22px, 4vw, 32px); line-height: 1.15 }
.sub { margin: 4px 0 0; opacity: 0.78; font-size: 14px }
form { display: grid; gap: 14px; border: 1px solid GrayText; padding: clamp(14px, 3vw, 22px); border-radius: 12px }
label { display: grid; gap: 6px; font-weight: 600; font-size: 13px }
.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px }
select, textarea, input, button { font: inherit; color: inherit; padding: 8px 10px; border: 1px solid GrayText; border-radius: 6px }
select, textarea, input { background: Canvas; width: 100%; box-sizing: border-box }
textarea, input[type=text], output, td, code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace }
textarea { min-height: 76px; resize: vertical }
button { justify-self: start; padding: 9px 18px; font-weight: 650; background: ButtonFace; cursor: pointer }
button:disabled { opacity: 0.55; cursor: default }
:focus-visible { outline: 2px solid Highlight; outline-offset: 2px }
#status { margin: 0; min-height: 1.4em; font-size: 14px }
output { display: block; white-space: pre-wrap; overflow-wrap: anywhere; padding: 12px; border: 1px solid GrayText; border-radius: 8px }
table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px }
th, td { padding: 6px 8px; border-bottom: 1px solid GrayText }
[hidden] { display: none !important }
</style>
</head>
<body>
<main>
<header>
  <h1>Guillotine EVM Playground</h1>
  <p class="sub">Inspect dispatch schedule fusions, basic blocks, JUMPDEST bitmaps, or execute bounded EVM bytecode through Guillotine.</p>
</header>
<form>
  <div class="controls">
    <label>Mode
      <select name="mode">
        <option value="analyze">Analyze dispatch and fusions</option>
        <option value="execute">Execute bytecode (native FFI)</option>
      </select>
    </label>
    <label>Hardfork
      <select name="hardfork">
        <option value="OSAKA">Osaka</option>
        <option value="PRAGUE">Prague</option>
        <option value="CANCUN">Cancun</option>
        <option value="SHANGHAI">Shanghai</option>
        <option value="LONDON">London</option>
      </select>
    </label>
    <label>Gas limit
      <input name="gas" type="number" value="100000" min="21000" max="500000" required>
    </label>
  </div>
  <label>Runtime bytecode (hex)
    <textarea name="bytecode" maxlength="8194" spellcheck="false" autocomplete="off">0x602a60005260206000f3</textarea>
  </label>
  <label>Calldata (hex)
    <input name="calldata" type="text" value="0x" maxlength="4098" spellcheck="false" autocomplete="off">
  </label>
  <button type="button" disabled>Run</button>
</form>
<p id="status" role="status">Connecting to Smithers…</p>
<section id="result" aria-label="Guillotine result" hidden>
  <output aria-label="Summary"></output>
  <table id="fusions" hidden>
    <caption>Detected synthetic opcode fusions</caption>
    <thead><tr><th scope="col">PC</th><th scope="col">Fusion</th><th scope="col">Opcodes</th></tr></thead>
    <tbody></tbody>
  </table>
  <table id="ops" hidden>
    <caption>Decoded bytecode stream</caption>
    <thead><tr><th scope="col">PC</th><th scope="col">Byte</th><th scope="col">Opcode</th><th scope="col">Immediate</th></tr></thead>
    <tbody></tbody>
  </table>
</section>
</main>
<script>
const host = "https://smithers.sh"
const form = document.querySelector("form")
const button = form.querySelector("button")
const status = document.querySelector("#status")
const result = document.querySelector("#result")
const output = result.querySelector("output")
const fusionsTable = document.querySelector("#fusions")
const fusionsBody = fusionsTable.querySelector("tbody")
const opsTable = document.querySelector("#ops")
const opsBody = opsTable.querySelector("tbody")
const nonce = document.documentElement.dataset.smithersNonce
const initId = "guillotine-playground"
let port
let pending
let nextId = 0

function paint(value) {
  const analysis = value.analysis ?? value
  const { instructions, fusions, ...summary } = value
  output.textContent = JSON.stringify(summary, null, 2)
  fusionsBody.replaceChildren()
  for (const f of Array.isArray(analysis.fusions) ? analysis.fusions.slice(0, 64) : []) {
    const row = fusionsBody.insertRow()
    row.insertCell().textContent = String(f.pc ?? "")
    row.insertCell().textContent = String(f.pattern ?? "")
    row.insertCell().textContent = Array.isArray(f.ops) ? f.ops.join(" + ") : ""
  }
  fusionsTable.hidden = fusionsBody.rows.length === 0
  opsBody.replaceChildren()
  for (const op of Array.isArray(analysis.instructions) ? analysis.instructions.slice(0, 256) : []) {
    const row = opsBody.insertRow()
    row.insertCell().textContent = String(op.pc ?? "")
    row.insertCell().textContent = String(op.opcode ?? "")
    row.insertCell().textContent = String(op.name ?? "")
    row.insertCell().textContent = String(op.imm ?? "")
  }
  opsTable.hidden = opsBody.rows.length === 0
  result.hidden = false
}

function receive(event) {
  const reply = event.data
  if (!pending || reply?.jsonrpc !== "2.0" || reply.id !== pending.id) return
  clearTimeout(pending.timer)
  pending = undefined
  button.disabled = false
  if (reply.result && typeof reply.result === "object" && !Array.isArray(reply.result)) {
    if (typeof reply.result.error === "string") {
      status.textContent = reply.result.error.slice(0, 256)
      if (reply.result.analysis) paint(reply.result)
    } else {
      paint(reply.result)
      status.textContent = reply.result.mode === "execute" ? "Execution complete" : "Analysis complete"
    }
  } else {
    status.textContent = "Execution unavailable"
  }
}

if (parent !== window && /^[A-Za-z0-9_-]{22,128}$/.test(nonce ?? "")) {
  const deadline = setTimeout(() => { status.textContent = "Smithers connection unavailable" }, 4000)
  window.addEventListener("message", function initialize(event) {
    const reply = event.data
    if (event.source !== parent || event.origin !== host || reply?.jsonrpc !== "2.0" ||
        reply.id !== initId || reply.result?.flow !== "playground/exec" || event.ports.length !== 1) return
    window.removeEventListener("message", initialize)
    clearTimeout(deadline)
    port = event.ports[0]
    port.onmessage = receive
    button.disabled = false
    status.textContent = "Ready"
  })
  parent.postMessage({ jsonrpc: "2.0", id: initId, method: "ui/initialize", params: { nonce } }, host)
} else {
  status.textContent = "Open from Smithers to run a request"
}

button.addEventListener("click", (event) => {
  event.preventDefault()
  if (!event.isTrusted || !port || pending) return
  const data = new FormData(form)
  const params = {
    mode: data.get("mode"),
    hardfork: data.get("hardfork"),
    bytecode: String(data.get("bytecode") ?? "").trim(),
    calldata: String(data.get("calldata") ?? "0x").trim(),
    gas: Number(data.get("gas"))
  }
  for (const hex of [params.bytecode, params.calldata]) {
    if (!/^0x(?:[0-9a-f]{2})*$/i.test(hex)) {
      status.textContent = "Enter even-length hex starting with 0x"
      return
    }
  }
  const id = ++nextId
  result.hidden = true
  status.textContent = "Running…"
  button.disabled = true
  const timer = setTimeout(() => {
    pending = undefined
    button.disabled = false
    status.textContent = "Request timed out"
  }, 15000)
  pending = { id, timer }
  port.postMessage({ jsonrpc: "2.0", id, method: "playground/exec", params })
})
</script>
</body>
</html>
